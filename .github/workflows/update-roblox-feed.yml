# Refreshes roblox-feed.json (real games for the Frontpage tool) once a day.
name: update roblox feed

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-roblox-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch feed
        run: node scripts/fetch-roblox-feed.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- roblox-feed.json)" ]; then
            echo "feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add roblox-feed.json
          git commit -m "Update Roblox feed"
          git push
